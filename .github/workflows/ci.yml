name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: "26.10.4"

      # after setup-nextflow, which sets up Java 17 for itself
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: "0.9.5"

      - name: Build the summary image
        run: |
          docker build -t hdv-summary:0.1.0 containers/summary
          docker image ls hdv-summary:0.1.0

      - name: Test summary.py
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install biopython==1.88 numpy==2.5.4 pytest==9.2.0
          "$RUNNER_TEMP/venv/bin/pytest" tests/test_summary.py

      - name: Run nf-test with Docker
        run: nf-test test --profile +docker

      - name: Install Apptainer
        run: |
          wget -q https://github.com/apptainer/apptainer/releases/download/v1.5.5/apptainer_1.5.5_amd64.deb
          sudo apt-get install -y ./apptainer_1.5.5_amd64.deb
          apptainer --version

      - name: Run the test profile with Apptainer
        env:
          NXF_APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer
        run: |
          mkdir -p "$NXF_APPTAINER_CACHEDIR"
          # Apptainer cannot pull a local Docker image, so convert it into the file Nextflow looks for in its cache
          apptainer build "$NXF_APPTAINER_CACHEDIR/hdv-summary-0.1.0.img" docker-daemon://hdv-summary:0.1.0
          nextflow run main.nf -profile test,apptainer -ansi-log false
          cat results/summary.tsv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results
          path: results/
